<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Chat Broadcaster</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;
            --twitch-color: #9146FF;
            --youtube-color: #FF0000;
            --button-hover: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaaaaa;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #666;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .platform-hints {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
            display: block;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--twitch-color) 0%, var(--youtube-color) 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .success { color: #4CAF50; }
        .error { color: #F44336; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Enviar para Live</h2>
        
        <div class="input-group">
            <label for="twitchInput">Twitch</label>
            <input type="text" id="twitchInput" placeholder="dante_will">
            <span class="platform-hints">Apenas o nome após a barra (ex: twitch.tv/<strong>nome</strong>)</span>
        </div>

        <div class="input-group">
            <label for="youtubeInput">YouTube</label>
            <input type="text" id="youtubeInput" placeholder="UCCOgOae02L-GF6_EFqfAgpA">
            <span class="platform-hints">Apenas o ID do canal após a barra (ex: youtube.com/channel/<strong>ID</strong>)</span>
        </div>

        <div class="input-group">
            <label for="messageInput">Sua Mensagem</label>
            <textarea id="messageInput" placeholder="Digite o que deseja enviar para os chats..."></textarea>
        </div>

        <button onclick="enviarMensagem()">Transmitir Mensagem</button>

        <div id="statusMessage"></div>
    </div>

    <script>
        // Função principal acionada pelo botão
        async function enviarMensagem() {
            const twitchCanal = document.getElementById('twitchInput').value.trim();
            const youtubeCanal = document.getElementById('youtubeInput').value.trim();
            const mensagem = document.getElementById('messageInput').value.trim();
            const statusDiv = document.getElementById('statusMessage');

            // Validação simples
            if (!mensagem) {
                mostrarStatus('Por favor, digite uma mensagem.', 'error');
                return;
            }
            if (!twitchCanal && !youtubeCanal) {
                mostrarStatus('Preencha pelo menos um canal (Twitch ou YouTube).', 'error');
                return;
            }

            mostrarStatus('Enviando...', '');

            try {
                // Aqui você chamará as funções de envio para cada plataforma
                // O Promise.all permite enviar para ambas ao mesmo tempo
                const promessas = [];

                if (twitchCanal) {
                    promessas.push(enviarParaTwitch(twitchCanal, mensagem));
                }
                
                if (youtubeCanal) {
                    promessas.push(enviarParaYouTube(youtubeCanal, mensagem));
                }

                await Promise.all(promessas);
                
                mostrarStatus('Mensagem enviada com sucesso!', 'success');
                document.getElementById('messageInput').value = ''; // Limpa o campo
                
            } catch (erro) {
                console.error(erro);
                mostrarStatus('Erro ao enviar. Verifique o console.', 'error');
            }
        }

        // --- MÓDULOS DE API (A SEREM PREENCHIDOS FUTURAMENTE) ---

        async function enviarParaTwitch(canal, mensagem) {
            console.log(`[Twitch - ${canal}]: ${mensagem}`);
            
            // TODO: Lógica futura da Twitch
            // Como o site estará no GitHub Pages (front-end puro), você provavelmente 
            // usará o "Implicit Grant Flow" do OAuth da Twitch para pegar um token
            // diretamente na URL e fazer um fetch() para a API Helix.
            
            /* Exemplo de fetch futuro:
            return fetch('https://api.twitch.tv/helix/chat/messages', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer SEU_TOKEN_AQUI',
                    'Client-Id': 'SEU_CLIENT_ID',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    broadcaster_id: ID_DO_CANAL,
                    sender_id: SEU_ID,
                    message: mensagem
                })
            });
            */
           
           // Simula o tempo de resposta da API
           return new Promise(resolve => setTimeout(resolve, 500));
        }

        async function enviarParaYouTube(canalID, mensagem) {
            console.log(`[YouTube - ${canalID}]: ${mensagem}`);
            
            // TODO: Lógica futura do YouTube
            // 1. Você precisará primeiro buscar o ID da Live Ativa (activeLiveChatId)
            // 2. Depois fazer o POST da mensagem para o chat específico daquela live.
            
            /* Exemplo de fetch futuro:
            return fetch('https://www.googleapis.com/youtube/v3/liveChat/messages?part=snippet', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer SEU_TOKEN_AQUI',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    snippet: {
                        liveChatId: 'ID_DO_CHAT_DA_LIVE',
                        type: 'textMessageEvent',
                        textMessageDetails: {
                            messageText: mensagem
                        }
                    }
                })
            });
            */

           // Simula o tempo de resposta da API
           return new Promise(resolve => setTimeout(resolve, 500));
        }

        // Função auxiliar para exibir feedback na tela
        function mostrarStatus(texto, classe) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = texto;
            statusDiv.className = classe;
        }
    </script>
</body>
</html>
