<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Live Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { background: #0f0f0f; color: white; }
        .menu-grid { display: grid; gap: 20px; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #333; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <main class="container">
        <h2 style="text-align: center; margin-top: 20px;">Bem-vindo</h2>
        
        <div class="menu-grid">
            <div class="card">
                <h3>Acesso</h3>
                <button onclick="window.location.href='/login/'" class="contrast">Página de Login</button>
            </div>

            <div class="card">
                <h3>Controle</h3>
                <button onclick="window.location.href='/chat/'" style="background:#9146ff">Abrir Chat Integrado</button>
                <button onclick="window.location.href='/extensao/'" style="background:#222; margin-top:10px">Extensão Chatdex</button>
            </div>
        </div>
    </main>
    <script src="/js/global.js"></script>
</body>
</html>
