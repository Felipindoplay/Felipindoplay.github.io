<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Live Broadcast Dashboard</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --twitch: #9146FF;
            --youtube: #FF0000;
            --text: #efeff1;
            --success: #4CAF50;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        h2 { text-align: center; margin-bottom: 1.5rem; color: #fff; }

        .auth-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-auth {
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-size: 13px;
        }

        .btn-yt { background: var(--youtube); color: white; }
        .btn-tw { background: var(--twitch); color: white; }
        .btn-auth:hover { filter: brightness(1.2); }
        .logged { border: 2px solid var(--success); box-shadow: 0 0 10px rgba(76, 175, 80, 0.3); }

        .field { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #adadb8; margin-bottom: 5px; }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn-send {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--twitch), var(--youtube));
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        #status { text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; }

        #cookie-popup {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #444;
            display: none;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            width: 90%;
            max-width: 600px;
        }

        .logout-link {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 10px;
            margin-top: 10px;
            display: block;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Multi-Live Broadcast</h2>

        <div class="auth-section">
            <button id="btnYt" class="btn-auth btn-yt" onclick="loginYT()">Login YouTube</button>
            <button id="btnTw" class="btn-auth btn-tw" onclick="loginTW()">Login Twitch</button>
        </div>

        <div class="field">
            <label>YouTube (@ do canal)</label>
            <input type="text" id="ytHandle" placeholder="@DanteWill" value="@DanteWill">
        </div>

        <div class="field">
            <label>Twitch (usuário)</label>
            <input type="text" id="twUser" placeholder="dante_will" value="dante_will">
        </div>

        <div class="field">
            <label>Mensagem</label>
            <textarea id="msg" placeholder="Digite sua mensagem aqui..."></textarea>
        </div>

        <button class="btn-send" onclick="disparar()">Enviar para Ambos</button>
        <button class="logout-link" onclick="limparSessao()">Sair de todas as contas / Limpar Cookies</button>

        <div id="status"></div>
    </div>

    <div id="cookie-popup">
        <p style="margin:0; font-size:13px;">Usamos cookies para manter sua sessão ativa.</p>
        <button onclick="aceitarCookies()" style="background:var(--success); color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Aceitar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
