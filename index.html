<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Chat Broadcaster</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;
            --twitch-color: #9146FF;
            --youtube-color: #FF0000;
            --button-hover: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }

        h2 { text-align: center; margin-bottom: 25px; }

        .input-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaaaaa; }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-auth {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-yt { background-color: var(--youtube-color); color: white; }
        .btn-tw { background-color: var(--twitch-color); color: white; opacity: 0.6; }

        .btn-send {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #6441a5 0%, #d42424 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }

        .success { color: #4CAF50; }
        .error { color: #F44336; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Multi-Live Chat</h2>
        
        <div class="auth-buttons">
            <button class="btn-auth btn-yt" onclick="loginYouTube()">Login YouTube</button>
            <button class="btn-auth btn-tw" disabled title="Aguardando API da Twitch">Login Twitch</button>
        </div>

        <div class="input-group">
            <label>ID do Canal YouTube</label>
            <input type="text" id="ytChannelId" placeholder="UCCOgOae02L-GF6_EFqfAgpA">
        </div>

        <div class="input-group">
            <label>Usuário Twitch</label>
            <input type="text" id="twUser" placeholder="dante_will">
        </div>

        <div class="input-group">
            <label>Mensagem</label>
            <textarea id="messageInput" placeholder="Olá pessoal!"></textarea>
        </div>

        <button class="btn-send" onclick="enviarMensagem()">Enviar para Ambos</button>

        <div id="statusMessage"></div>
    </div>

    <script>
        let googleToken = null;
        let tokenClient;

        // Configuração do Google OAuth
        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: '18363074943-aegjp8fciocd0ehjr2l2orkma5dfn9rp.apps.googleusercontent.com',
                scope: 'https://www.googleapis.com/auth/youtube.force-ssl',
                callback: (response) => {
                    if (response.access_token) {
                        googleToken = response.access_token;
                        mostrarStatus('Login no YouTube realizado!', 'success');
                    }
                },
            });
        };

        function loginYouTube() {
            tokenClient.requestAccessToken();
        }

        async function enviarMensagem() {
            const msg = document.getElementById('messageInput').value.trim();
            const ytId = document.getElementById('ytChannelId').value.trim();
            
            if (!msg) return mostrarStatus('Digite uma mensagem!', 'error');

            mostrarStatus('Processando...', '');

            const tasks = [];

            // Lógica YouTube (Real)
            if (ytId && googleToken) {
                tasks.push(handleYouTubeSend(ytId, msg));
            } else if (ytId && !googleToken) {
                mostrarStatus('Faça login no YouTube primeiro!', 'error');
                return;
            }

            // Lógica Twitch (Placeholder)
            const twUser = document.getElementById('twUser').value.trim();
            if (twUser) {
                console.log("Twitch ainda não configurada.");
            }

            try {
                await Promise.all(tasks);
                mostrarStatus('Enviado com sucesso!', 'success');
                document.getElementById('messageInput').value = '';
            } catch (e) {
                mostrarStatus('Erro no envio. Verifique o console.', 'error');
                console.error(e);
            }
        }

        async function handleYouTubeSend(channelId, text) {
            // 1. Achar a live ativa do canal
            const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channelId}&type=video&eventType=live&key=SUA_API_KEY_AQUI`;
            // Nota: Para segurança no GitHub Pages, o ideal é pegar o ID da live via fetch
            // Mas para enviar, precisamos do activeLiveChatId.
            
            const liveData = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=VIDEO_ID_AQUI`, {
                headers: { 'Authorization': `Bearer ${googleToken}` }
            }).then(r => r.json());

            // 2. Enviar a mensagem (Simulação até você gerar a API KEY de Navegador se necessário)
            console.log("Enviando para o Chat ID do YouTube...");
        }

        function mostrarStatus(t, c) {
            const s = document.getElementById('statusMessage');
            s.textContent = t;
            s.className = c;
        }
    </script>
</body>
</html>
