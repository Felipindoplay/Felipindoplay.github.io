<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MultiDash</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { background-color: #0f0f0f; color: white; }
        main { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
        article { width: 100%; max-width: 400px; background: #1a1a1a; border: 1px solid #333; }
        .login-btns { display: flex; flex-direction: column; gap: 15px; }
        .btn-tw { background-color: #9146ff; border: none; }
        .btn-yt { background-color: #ff0000; border: none; }
        .btn-back { margin-top: 20px; }
    </style>
</head>
<body>

    <main class="container">
        <article>
            <header>
                <h2 style="text-align: center; margin: 0;">Conectar Contas</h2>
            </header>
            
            <div class="login-btns">
                <button class="btn-yt" onclick="handleLoginYT()">Login com YouTube</button>
                <button class="btn-tw" onclick="handleLoginTW()">Login com Twitch</button>
            </div>

            <footer>
                <button class="secondary outline w-100 btn-back" onclick="window.location.href='/'">
                    Voltar ao Início
                </button>
            </footer>
        </article>
    </main>

    <script src="../js/global.js"></script>

    <script>
        let googleTokenClient;

        window.onload = () => {
            // Inicializa Google Auth
            googleTokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CONFIG.YT_CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/youtube.force-ssl',
                callback: (tokenResponse) => {
                    if (tokenResponse.access_token) {
                        DB.save('yt_token', tokenResponse.access_token);
                        fetchYouTubeProfile(tokenResponse.access_token);
                    }
                },
            });

            // Captura retorno da Twitch (vem no # da URL)
            const params = new URLSearchParams(window.location.hash.replace('#', '?'));
            if (params.has('access_token')) {
                const token = params.get('access_token');
                DB.save('tw_token', token);
                fetchTwitchProfile(token);
                // Limpa a URL para segurança
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        };

        // --- LÓGICA YOUTUBE ---
        function handleLoginYT() {
            googleTokenClient.requestAccessToken();
        }

        async function fetchYouTubeProfile(token) {
            try {
                const res = await fetch('https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.items && data.items.length > 0) {
                    const avatar = data.items[0].snippet.thumbnails.default.url;
                    DB.save('yt_avatar', avatar);
                    location.reload(); // Recarrega para o global.js atualizar o header
                }
            } catch (e) { console.error("Erro perfil YT", e); }
        }

        // --- LÓGICA TWITCH ---
        function handleLoginTW() {
            const scopes = encodeURIComponent('user:write:chat user:read:chat');
            const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${CONFIG.TW_CLIENT_ID}&redirect_uri=${CONFIG.REDIRECT_URI}&response_type=token&scope=${scopes}`;
            window.location.href = authUrl;
        }

        async function fetchTwitchProfile(token) {
            try {
                const res = await fetch('https://api.twitch.tv/helix/users', {
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Client-Id': CONFIG.TW_CLIENT_ID 
                    }
                });
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    const avatar = data.data[0].profile_image_url;
                    DB.save('tw_avatar', avatar);
                    location.reload();
                }
            } catch (e) { console.error("Erro perfil TW", e); }
        }
    </script>
</body>
</html>
