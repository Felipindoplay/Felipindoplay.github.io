<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Chat | MultiDash</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { background: #0f0f0f; color: white; height: 100vh; display: flex; flex-direction: column; margin: 0; }
        .chat-wrapper { display: flex; flex: 1; gap: 10px; padding: 10px; overflow: hidden; }
        .chat-column { flex: 1; background: #151515; border-radius: 12px; display: flex; flex-direction: column; border: 1px solid #333; overflow: hidden; }
        .chat-header { padding: 10px; border-bottom: 1px solid #333; font-weight: bold; text-align: center; }
        
        /* Estilo da Mensagem Fixada (Estilo Twitch) */
        #tw-pinned-area {
            background: #1f1f23;
            padding: 12px;
            border-bottom: 2px solid #9146ff;
            display: none; /* Escondido por padrão */
            animation: slideDown 0.3s ease;
        }
        .pinned-content { display: flex; align-items: flex-start; gap: 12px; }
        .pinned-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #9146ff; }
        .pinned-info { flex: 1; }
        .pinned-user-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .pinned-badge { 
            background: #9146ff; color: white; font-size: 9px; 
            padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: bold;
        }
        .pinned-name { font-weight: bold; font-size: 0.85rem; color: #efeff1; }
        .pinned-msg { font-size: 0.9rem; color: #adadb8; line-height: 1.2; }

        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 5px; }
        .msg-line { line-height: 1.4; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .user-name { font-weight: bold; margin-right: 5px; }
        .tw-name { color: #bf94ff; }
        .yt-name { color: #ff4e4e; }
        
        @media (max-width: 768px) { .chat-wrapper { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="chat-wrapper">
        <div id="col-twitch" class="chat-column">
            <div class="chat-header" style="color: #9146ff;">Twitch Chat</div>
            
            <div id="tw-pinned-area">
                <div class="pinned-content">
                    <img id="pinned-img" src="" class="pinned-avatar">
                    <div class="pinned-info">
                        <div class="pinned-user-row">
                            <span id="pinned-role" class="pinned-badge">Streamer</span>
                            <span id="pinned-username" class="pinned-name">Carregando...</span>
                        </div>
                        <div id="pinned-text" class="pinned-msg">Carregando mensagem importante...</div>
                    </div>
                </div>
            </div>

            <div id="tw-messages" class="chat-messages"></div>
        </div>

        <div id="col-youtube" class="chat-column" style="display: none;">
            <div class="chat-header" style="color: #ff0000;">YouTube Chat</div>
            <div id="yt-messages" class="chat-messages"></div>
        </div>
    </div>

    <script src="../../js/global.js"></script>
    <script src="chat.js"></script>
</body>
</html>
