<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Chat | Enviar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; }
        .chat-container { padding-top: 20px; }
        .status-box { 
            padding: 10px; 
            border-radius: 8px; 
            margin-top: 15px; 
            font-size: 0.9rem; 
            text-align: center;
            min-height: 50px;
        }
        .input-group { margin-bottom: 1rem; }
        textarea { resize: none; border-radius: 12px; }
    </style>
</head>
<body>

    <main class="container chat-container">
        <article>
            <header>
                <h3 style="margin:0">Painel de Envio</h3>
            </header>

            <div class="grid">
                <div class="input-group">
                    <label for="ytHandle">YouTube (@)</label>
                    <input type="text" id="ytHandle" placeholder="@Canal">
                </div>
                <div class="input-group">
                    <label for="twUser">Twitch</label>
                    <input type="text" id="twUser" placeholder="usuario">
                </div>
            </div>

            <div class="input-group">
                <label for="msg">Sua Mensagem</label>
                <textarea id="msg" rows="3" placeholder="Digite algo para os chats..."></textarea>
            </div>

            <button id="btnSend" class="primary" onclick="mainChat.disparar()">
                Enviar para Todos
            </button>

            <div id="status" class="status-box"></div>

            <footer>
                <button class="secondary outline w-100" onclick="window.location.href='/'">
                    Voltar ao Início
                </button>
            </footer>
        </article>
    </main>

    <script src="../js/global.js"></script>
    <script src="chat.js"></script>
</body>
</html>
