<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatdex Launcher | MultiDash</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .launcher-card { text-align: center; background: #1a1a1a; padding: 40px; border-radius: 16px; border: 1px solid #333; max-width: 400px; width: 100%; }
        .status-dot { height: 12px; width: 12px; background: #9146ff; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 10px #9146ff; }
    </style>
</head>
<body>

    <main class="container">
        <div class="launcher-card">
            <div style="margin-bottom: 20px;">
                <span class="status-dot"></span>
                <span style="color: #adadb8; font-size: 0.9rem;">Status: Pronto para Lançar</span>
            </div>
            
            <h3>Chatdex Extension</h3>
            <p style="font-size: 0.9rem; color: #adadb8;">A extensão será aberta em uma janela flutuante otimizada para não travar o seu dashboard.</p>
            
            <button class="primary" onclick="ChatdexLauncher.open()">
                Abrir Chatdex agora
            </button>

            <footer style="margin-top: 20px;">
                <a href="/" class="secondary outline" style="font-size: 0.8rem;">← Voltar ao Início</a>
            </footer>
        </div>
    </main>

    <script src="../js/global.js"></script>
    <script src="chatdex.js"></script>
</body>
</html>
